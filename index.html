<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

@media (prefers-reduced-motion: reduce){
    *{
        animation-duration:0.001ms !important;
        animation-iteration-count:1 !important;
        transition-duration:0.001ms !important;
    }
}

.content-links{
    display:flex;
    justify-content:center;
    align-items:center;
}


body{
    font-family:'Satoshi',sans-serif;
    color:#fff;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:30px;
    overflow-x:hidden;

    background:
        radial-gradient(circle at 50% -10%, rgba(90,160,255,.35), transparent 35%),
        radial-gradient(circle at 20% 25%, rgba(70,120,255,.12), transparent 40%),
        radial-gradient(circle at 85% 70%, rgba(0,180,255,.10), transparent 35%),
        radial-gradient(circle at 50% 100%, rgba(25,60,140,.20), transparent 55%),
        linear-gradient(180deg,
            #132a52 0%,
            #0d1c36 30%,
            #08111f 65%,
            #04060c 100%);
}

/* slow ambient drift behind everything — the one piece of continuous motion */
body::before{

    content:"";

    position:fixed;

    inset:-10%;

    pointer-events:none;

    background:
        radial-gradient(
            circle at 50% -5%,
            rgba(90,170,255,.22),
            transparent 45%
        );

    filter:blur(70px);

    z-index:-1;

    animation:drift 16s ease-in-out infinite;
}

@keyframes drift{
    0%,100%{ transform:translate(0,0) scale(1); }
    50%{ transform:translate(1.5%,2%) scale(1.04); }
}

body::after{

content:"";

position:fixed;
inset:0;

background-image:
url("noise.png");

opacity:.025;

pointer-events:none;
}

.container{

    position:relative;

    width:min(1500px, calc(100vw - 40px));
    min-height:calc(100vh - 40px);

    background:
        linear-gradient(
            180deg,
            rgba(18,30,52,.78),
            rgba(10,18,33,.68)
        );

    backdrop-filter:blur(24px);
    -webkit-backdrop-filter:blur(24px);

    border:1px solid rgba(255,255,255,.06);

    border-radius:28px;

    padding:50px 90px;

    display:flex;
    flex-direction:column;
    justify-content:space-between;

    text-align:center;

    box-shadow:
        0 40px 90px rgba(0,0,0,.55),
        0 0 120px rgba(45,110,255,.10),
        inset 0 1px rgba(255,255,255,.05);

    opacity:0;
    animation:fade .9s cubic-bezier(.16,1,.3,1) forwards;
}

/* Glass border highlight */
.container::before{

    content:"";

    position:absolute;
    inset:0;

    border-radius:28px;

    padding:1px;

    background:linear-gradient(
        180deg,
        rgba(120,190,255,.16),
        rgba(255,255,255,.02)
    );

    -webkit-mask:
        linear-gradient(#fff 0 0) content-box,
        linear-gradient(#fff 0 0);

    -webkit-mask-composite:xor;
            mask-composite:exclude;

    pointer-events:none;
}

@keyframes fade{

from{

opacity:0;

transform:translateY(18px);

}

to{

opacity:1;

transform:none;

}

}

/* one orchestrated reveal sequence — each element steps in after the shell settles */
.reveal{
    opacity:0;
    transform:translateY(10px);
    animation:reveal .7s cubic-bezier(.16,1,.3,1) forwards;
}

@keyframes reveal{
    to{ opacity:1; transform:none; }
}

h1{

    font-family:'Outfit',sans-serif;
    font-weight:800;
    letter-spacing:8px;
    font-size:5rem;
    text-transform:uppercase;

    background:linear-gradient(100deg,
        #ffffff 0%,
        #cfe3ff 35%,
        #7fb2ff 55%,
        #ffffff 75%);
    background-size:220% 100%;
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;

    text-shadow:
        0 0 30px rgba(120,180,255,.25);

    animation:reveal .7s cubic-bezier(.16,1,.3,1) forwards,
              shimmer 7s ease-in-out .9s infinite;
    animation-delay:.15s, 1.2s;
}

@keyframes shimmer{
    0%{ background-position:0% 50%; }
    50%{ background-position:100% 50%; }
    100%{ background-position:0% 50%; }
}

.alias{

    margin-top:10px;

    color:#8b949e;

    font-size:1rem;

    letter-spacing:4px;

    animation-delay:.28s;
}

.bio{

    margin-top:25px;

    color:#c9d1d9;

    font-size:1.05rem;

    animation-delay:.38s;
}

.status{

    margin-top:18px;

    display:inline-flex;

    justify-content:center;

    align-items:center;

    gap:8px;

    color:#8b949e;

    font-size:.95rem;

    animation-delay:.48s;
}

.status::before{

    content:"";

    width:8px;

    height:8px;

    background:#2ecc71;

    border-radius:50%;

    box-shadow:0 0 10px #2ecc71;

    animation:pulse 2.2s ease-in-out infinite;
}

@keyframes pulse{
    0%,100%{ box-shadow:0 0 10px #2ecc71; opacity:1; }
    50%{ box-shadow:0 0 4px #2ecc71; opacity:.55; }
}

.section-title{

    margin-top:30px;
    margin-bottom:14px;

    color:#8b949e;

    text-transform:uppercase;

    letter-spacing:4px;

    font-size:.82rem;

    animation-delay:.55s;
}

.links{

    display:flex;

    flex-wrap:wrap;

    justify-content:center;

    gap:16px;

}

.links a{

display:flex;

flex-direction:column;

justify-content:center;

align-items:center;

gap:10px;

width:125px;
height:110px;

background:linear-gradient(
180deg,
rgba(255,255,255,.055),
rgba(255,255,255,.02)
);

backdrop-filter:blur(18px);

-webkit-backdrop-filter:blur(18px);

border:1px solid rgba(255,255,255,.05);

border-radius:18px;

text-decoration:none;

color:white;

cursor:pointer;

opacity:0;
transform:translateY(10px);
animation:reveal .6s cubic-bezier(.16,1,.3,1) forwards;

transition:
transform .3s cubic-bezier(.16,1,.3,1),
background .3s,
border-color .3s,
box-shadow .3s;
}

/* stagger each tile slightly so the grid settles in one wave, not scattered pops */
.links a:nth-child(1){ animation-delay:.62s; }
.links a:nth-child(2){ animation-delay:.68s; }
.links a:nth-child(3){ animation-delay:.74s; }
.links a:nth-child(4){ animation-delay:.80s; }

.content-links a:nth-child(1){ animation-delay:.90s; }

.links span{

font-size:.82rem;
color:#c7d2e5;
transition:color .25s;
}

.links a:hover,
.links a:focus-visible{

transform:
translateY(-6px)
scale(1.03);

box-shadow:
0 20px 45px rgba(0,0,0,.45),
0 0 22px rgba(90,160,255,.18);

background:
linear-gradient(
180deg,
rgba(255,255,255,.08),
rgba(255,255,255,.03)
);

border-color:rgba(120,180,255,.28);
}

.links a:focus-visible{
    outline:2px solid rgba(120,180,255,.6);
    outline-offset:3px;
}

.links a:active{
    transform:translateY(-2px) scale(.98);
}

.links a:hover svg{
  transform:scale(1.12);
  filter:drop-shadow(0 0 8px rgba(120,180,255,.55));
}

.links a:hover span{
    color:#fff;
}

.links svg{

width:26px;
height:26px;
fill:#fff;

transition:
transform .25s,
filter .25s;

}

.divider{

    width:0;

    height:1px;

    background:linear-gradient(90deg, transparent, #30363d, transparent);

    margin:35px auto 25px;

    animation:draw .8s cubic-bezier(.16,1,.3,1) .95s forwards;
}

@keyframes draw{
    to{ width:90px; }
}

.spacer{
    flex:.4;
}

.quote{

    color:#a7b0bd;

    font-size:1.15rem;

    font-style:italic;

    opacity:.9;

    margin-bottom:16px;

    animation-delay:1.05s;
}

.quote.reveal{ opacity:0; }

.footer{
    color:#6e7681;
    font-size:.82rem;
    opacity:.8;
    letter-spacing:1px;

    animation-delay:1.12s;
}

.footer.reveal{ opacity:0; }


@media (max-width:700px){

    .content-links{
        display:flex;
        justify-content:center;
        align-items:center;
    }

    .content-links a{
        width:145px;
        max-width:145px;
    }

    .links.content-links{
        display:flex !important;
        justify-content:center !important;
        align-items:center;
    }


body{
    padding:14px;
}

.container{
    width:100%;
    min-height:auto;
    padding:28px 22px;
}

h1{
    font-size:3.3rem;
    letter-spacing:5px;
}

.alias{
    font-size:.95rem;
}

.bio{
    margin-top:18px;
}

.section-title{
    margin-top:24px;
    margin-bottom:14px;
}

.links{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:14px;
    justify-items:center;
}

.links a{
    width:100%;
    max-width:145px;
    height:105px;
}

.quote{
    font-size:1rem;
}

.footer{
    font-size:.8rem;
}

}

</style>
</head>
